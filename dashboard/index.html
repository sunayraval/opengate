<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeAPI AI Runner Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <header class="glass-panel">
            <div class="logo-area" style="display: flex; align-items: center; gap: 1rem;">
                <h1>Server Dashboard</h1>
                <span id="ip-address" class="btn small" style="background: #e0f2fe; color: #0284c7; border: none; font-weight: 600;">IP: Loading...</span>
            </div>
            <div class="controls-area">
                <div class="status-indicator" id="status-indicator">
                    <span class="pulse-dot"></span>
                    <span id="status-text">Checking Status...</span>
                </div>
                <div class="action-buttons">
                    <button id="btn-start" class="btn primary" disabled>Start Server</button>
                    <button id="btn-stop" class="btn danger" disabled>Stop Server</button>
                </div>
            </div>
        </header>

        <!-- Model Management Section -->
        <section class="glass-panel" style="padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem;">
            <h2 style="font-size: 1rem; margin-right: auto;">Model Management</h2>
            <select id="model-select" class="btn small" style="background: white; padding: 0.5rem; font-size: 0.9rem;">
                <option value="google/gemma-3-4b-it">google/gemma-3-4b-it</option>
            </select>
            <button id="btn-load-model" class="btn primary">Load to VRAM</button>
            <button id="btn-unload-model" class="btn danger">Unload from VRAM</button>
        </section>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs" style="display: flex; gap: 1rem; padding: 0 1.5rem; margin-bottom: 1rem;">
            <button class="nav-btn active" data-target="dashboard" style="padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Runner Dashboard</button>
            <button class="nav-btn" data-target="communicate" style="padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Communicate</button>
        </nav>
        <!-- Main Content Area -->
        <main class="main-grid">
            
            <!-- Settings Panel -->
            <div id="settings" class="panel" style="display: none;">
                <h2 class="panel-title">Server Configuration</h2>
                <div class="card">
                    <p>Configuration settings will be placed here.</p>
                </div>
            </div>

            <!-- Communicate Panel -->
            <div id="communicate" class="panel" style="display: none;">
                <h2 class="panel-title">Chat with Robot</h2>
                <div class="chat-card card">
                    <div id="chat-messages" class="chat-messages">
                        <!-- Chat messages will appear here -->
                        <div class="message system-msg">Hold Spacebar or click the microphone to speak!</div>
                    </div>
                    
                    <div class="chat-input-area">
                        <button id="btn-mic" class="mic-btn" title="Hold to talk (Spacebar)"><i class="fas fa-microphone"></i></button>
                        <input type="text" id="chat-text-input" placeholder="Type a message or speak..." autocomplete="off">
                        <button id="btn-send-text" class="btn primary-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- Logs Terminal -->
            <section class="glass-panel logs-section" id="dashboard">
                <div class="panel-header">
                    <h2>Terminal Logs</h2>
                    <button id="btn-clear-logs" class="btn small">Clear</button>
                </div>
                <div class="terminal-container" id="terminal">
                    <!-- Logs will be appended here -->
                </div>
            </section>

            <!-- API Calls -->
            <section class="glass-panel calls-section">
                <div class="panel-header">
                    <h2>Recent Calls</h2>
                    <span class="call-count" id="call-count">0 calls</span>
                </div>
                <div class="calls-list" id="calls-list">
                    <div class="empty-state">No calls yet.</div>
                </div>
            </section>

        </main>
    </div>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
