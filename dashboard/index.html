<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeAPI AI Runner Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <header class="glass-panel">
            <div class="logo-area" style="display: flex; align-items: center; gap: 1rem;">
                <h1>Server Dashboard</h1>
                <span id="ip-address" class="btn small" style="background: #e0f2fe; color: #0284c7; border: none; font-weight: 600;">IP: Loading...</span>
            </div>
            <div class="controls-area">
                <div class="status-indicator" id="status-indicator">
                    <span class="pulse-dot"></span>
                    <span id="status-text">Checking Status...</span>
                </div>
                <div class="action-buttons">
                    <button id="btn-start" class="btn primary" disabled>Start Server</button>
                    <button id="btn-stop" class="btn danger" disabled>Stop Server</button>
                </div>
            </div>
        </header>

        <!-- Model Management Section -->
        <section class="glass-panel" style="padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem;">
            <h2 style="font-size: 1rem; margin-right: auto;">Model Management</h2>
            <select id="model-select" class="btn small" style="background: white; padding: 0.5rem; font-size: 0.9rem;">
                <option value="google/gemma-3-4b-it">google/gemma-3-4b-it</option>
            </select>
            <button id="btn-load-model" class="btn primary">Load to VRAM</button>
            <button id="btn-unload-model" class="btn danger">Unload from VRAM</button>
        </section>

        <!-- Main Content Area -->
        <main class="main-grid">
            
            <!-- Logs Terminal -->
            <section class="glass-panel logs-section">
                <div class="panel-header">
                    <h2>Terminal Logs</h2>
                    <button id="btn-clear-logs" class="btn small">Clear</button>
                </div>
                <div class="terminal-container" id="terminal">
                    <!-- Logs will be appended here -->
                </div>
            </section>

            <!-- API Calls -->
            <section class="glass-panel calls-section">
                <div class="panel-header">
                    <h2>Recent Calls</h2>
                    <span class="call-count" id="call-count">0 calls</span>
                </div>
                <div class="calls-list" id="calls-list">
                    <div class="empty-state">No calls yet.</div>
                </div>
            </section>

        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
